name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, type-check/build, and the suites that need no database. The backend
  # integration suite (test:backend:run) mocks all DB access, so it runs here.
  checks:
    name: Lint, tests (no DB), build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit && npx tsc -p tsconfig.node.json --noEmit
      - name: Frontend tests
        run: npm run test:frontend:run
      - name: Backend tests (mocked, no DB)
        run: npm run test:backend:run
      - name: Shared tests
        run: npm run test:run --workspace=packages/shared
      - name: Build
        run: npm run build

  # The packages/backend workspace suite hits a real Postgres (registration,
  # login, refresh-token rotation, the comprehensive-requirements suite).
  backend-db:
    name: Backend DB suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: react_calendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/react_calendar_test
      # packages/backend/src/test/setup.ts prefers TEST_DATABASE_URL when set.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/react_calendar_test
      # The L2 real-DB service suites (lib/services/*.db.test.ts and
      # packages/backend AuthService.db.test.ts) gate on L2_TEST_DATABASE_URL
      # and run against their OWN database, kept separate from react_calendar_test
      # so the comprehensive-requirements suite's global cleanup can't race them.
      L2_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_l2_test
      # Non-production, so jwt.ts uses its dev fallback; set explicitly anyway.
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Create L2 test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE taskflow_l2_test'
      - name: Run migrations
        run: npm run db:migrate
      - name: Run migrations (L2 database)
        run: DATABASE_URL="$L2_TEST_DATABASE_URL" npm run db:migrate
      - name: Backend workspace suite (real DB, incl. AuthService L2)
        run: npm run test:run --workspace=packages/backend
      - name: L2 service suites (real DB)
        run: npm run test:l2
